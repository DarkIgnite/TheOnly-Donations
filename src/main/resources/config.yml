# ====================================================================
#              TheOnly-Donations (AvatarDonation)
#          Konfigurasi Pembelian & Discord Webhook LeftyCraft
# ====================================================================

# (options)
#   (useUUID) Menggunakan UUID saat mengambil skin kepala pemain?
#             (Set 'false' jika server offline/cracked/bedrock)
options:
  useUUID: false

# ====================================================================
# DISCORD WEBHOOK NOTIFICATION
# Notifikasi otomatis ke Discord setiap kali transaksi berhasil diproses!
# ====================================================================
discordWebhook:
  enabled: true
  webhookUrl: "https://discord.com/api/webhooks/1546041139696631849/O6fi2xrEQDxoVykCqFsGqtQZeUahHsaU_jZQkoSDxrx8puuWxXicdRxge-RYhfy057bm"
  username: "LeftyCraft • Store"
  avatarUrl: "https://mc-heads.net/avatar/MHF_Chest/100"
  content: "" # Teks mention (opsional, contoh: "@everyone" atau "<@&ROLE_ID>")
  embed:
    enabled: true
    title: "✨ NOTIFIKASI PEMBELIAN STORE ✨"
    url: ""
    description: "Pemain **`{player}`** baru saja menyelesaikan pembelian di store!\nTerima kasih banyak telah mendukung server **LeftyCraft**."
    # Warna default embed jika product tidak memiliki webhookColor khusus:
    color: "#FFD700"
    # URL Kepala/Avatar Pemain:
    # {player} = Nama Player, {player_uuid} = UUID Player
    thumbnailUrl: "https://mc-heads.net/avatar/{player}/100"
    image: "" # Banner gambar besar di bawah embed (opsional)
    fields:
      - name: "👤 Pembeli"
        value: "> ```{player}```"
        inline: true
      - name: "📦 Paket / Rank"
        value: "> ```{product_displayname}```"
        inline: true
      - name: "💵 Total Pembayaran"
        value: "> ```Rp {product_price}```"
        inline: true
      - name: "ℹ️ Informasi Server"
        value: "Ketik `/store` atau `/ranks` di in-game untuk info rank, upgrade rank, dan rewards!"
        inline: false
    footer:
      text: "LeftyCraft • Store Notification"
      iconUrl: "https://mc-heads.net/avatar/MHF_Heart/100"
    timestamp: true

# ====================================================================
# BOSSBAR GOAL
# ====================================================================
bossbar:
  enabled: false
  # Placeholders: {current}, {goal}, {percentage}
  title: "Target Bulan Ini: Rp{current}/Rp{goal} ({percentage}%)"
  color: "GREEN" # BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
  style: "SEGMENTED_10" # SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20

# ====================================================================
# PESAN BROADCAST IN-GAME (8 Baris Bersih & Pas di Samping Avatar)
# ====================================================================
donationsMessage:
  messageWithAvatar:
    enabled: true # Menampilkan kepala pemain di chat. Panjang teks sudah disesuaikan agar pas 1 baris
    messages:
      header: "&6&m----------------------------------------"
      line1: " &e&l{player}"
      line2: " &6» &7Beli: &a{product_displayname}"
      line3: " &6» &7Total: &fRp {product_price}"
      line4: ""
      line5: " &eTerima kasih atas dukungannya!"
      line6: " &7LeftyCraft makin berkembang."
      line7: ""
      line8: " &6Store: &e/store &7| &6Info: &e/ranks"
      footer: "&6&m----------------------------------------"
  messageWithoutAvatar:
    messages:
      - "&6&m--------------------------------------------"
      - " &6» &l{player} &ebaru saja membeli &a&l{product_displayname}&e!"
      - " &6» Toko: &e/store &7atau &e/ranks"
      - " &6» Total: &aRp {product_price}"
      - " &7Terima kasih atas dukungannya untuk LeftyCraft!"
      - "&6&m--------------------------------------------"

# ====================================================================
# EFEK & REWARD SAAT PEMBELIAN BERHASIL
# ====================================================================
events:
  effect:
    enabled: true
    effects:
      - "SPEED;3;30"
      - "JUMP;5;30"
      - "FAST_DIGGING;3;30"
      - "NIGHT_VISION;3;30"
  sounds:
    - "ENTITY_PLAYER_LEVELUP;1.0;1.0"
    - "BLOCK_LAVA_POP;1.0;1.0"
    - "UI_TOAST_CHALLENGE_COMPLETE;1.0;1.2"
  titleBar:
    enabled: true
    title: "&e&l{player} &fbaru saja membeli &a&l{product_displayname}&f!"
    subTitle: "&aSemua pemain online mendapatkan efek & 1x Kunci Legendary!"
    fadeIn: 20
    stay: 60
    fadeOut: 20
  # Kembang api (Fireworks) di lokasi pembeli saat transaksi sukses
  fireworks:
    enabled: true
    amount: 4 # Jumlah kembang api
    delay: 6 # Jarak tick antar kembang api (20 ticks = 1 detik)
    types:
      - "BALL"
      - "BURST"
      - "STAR"
    colors:
      - "#FFAA00"
      - "#FFD700"
      - "#00FF88"
      - "#00D2FF"
      - "#B300FF"
  command:
    enabled: true
    commands:
      - "broadcast &e&l{player} &fbaru saja membeli rank &a&l{product_displayname}&f &6&l(/ranks)&f, semua pemain mendapatkan &a1x Kunci Legendary&f!"
      - "crate key giveall legendary 1"

# ====================================================================
# TARGET BULANAN (GOAL)
# ====================================================================
donationGoal:
  enabled: false
  donationGoal: 1500000
  progressBar:
    barLength: 15
    symbol: '█'
    completedColor: GREEN
    notCompletedColor: RED
  commandsOnReach:
    - "broadcast &aTarget bulanan server telah tercapai! Terima kasih semuanya!"

# ====================================================================
# PESAN SISTEM & PERINTAH
# ====================================================================
messages:
  noPermission: "&cAnda tidak memiliki izin untuk menggunakan perintah ini!"
  reload: "&aKonfigurasi plugin berhasil dimuat ulang (reloaded)!"
  invalidProduct: "&cProduk atau paket rank dengan nama tersebut tidak ditemukan!"
  performDonation: "&aBerhasil memproses pembelian untuk pemain &e{player}&a!"
  reset: "&aTotal target berhasil direset!"
  help:
    - "&6&l=== BANTUAN STORE (THEONLY-DONATIONS) ==="
    - "&e- /donations help &7- Menampilkan daftar bantuan ini"
    - "&e- /donations reload &7- Memuat ulang file konfigurasi"
    - "&e- /donations reset &7- Mereset total transaksi saat ini"
    - "&e- /donations send <player> <product> &7- Memberikan paket kepada pemain"